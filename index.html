<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鹿浜 フロアマップ</title>
<meta name="description" content="鹿浜A館・B館のフロアマップ｜機種をタップすると正式名が表示されます">
<meta property="og:type" content="website">
<meta property="og:url" content="https://toaykotobuki-shikahama.github.io/shikahama-floormap/">
<meta property="og:title" content="鹿浜 フロアマップ">
<meta property="og:description" content="鹿浜A館・B館のフロアマップ｜機種をタップすると正式名が表示されます">
<meta property="og:image" content="https://toaykotobuki-shikahama.github.io/shikahama-floormap/shikahama-top.png">
<meta property="og:image:alt" content="コトブキプラス鹿浜店 フロアマップ（A館・B館）">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="鹿浜 フロアマップ">
<meta name="twitter:description" content="鹿浜A館・B館のフロアマップ｜機種をタップすると正式名が表示されます">
<meta name="twitter:image" content="https://toaykotobuki-shikahama.github.io/shikahama-floormap/shikahama-top.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; background: #EEF6EF; color: #1A1A1A; }
  .top { display: block; width: 100%; max-width: 760px; margin: 0 auto; }
  .top img { display: block; width: 100%; height: auto; }
  header { background: #23AC38; color: #fff; padding: 16px 20px; text-align: center; }
  header p { margin: 0; font-size: 16px; font-weight: 700; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 20px 40px; }
  a.hall { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 3px solid #23AC38; border-radius: 16px; padding: 22px 24px; margin-bottom: 16px; color: #1A1A1A; text-decoration: none; font-size: 24px; font-weight: 900; }
  a.hall span { font-size: 15px; font-weight: 700; color: #23AC38; }
  a.hall .name small { display: block; font-size: 13px; font-weight: 700; color: #555; margin-top: 4px; min-height: 1em; }
  a.hall:active { background: #E5F4E4; }
  .note { font-size: 12px; color: #555; line-height: 1.7; margin-top: 24px; }
</style>
</head>
<body>
<div class="top">
  <img src="shikahama-top.png" alt="コトブキプラス鹿浜店 フロアマップ A館・B館 タップで機種検索" width="1734" height="907">
</div>
<header>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">鹿浜 フロアマップ</h1>
  <p>館を選んでください</p>
</header>
<main>
  <a class="hall" href="shikahama-a.html"><div class="name">A館<small id="date-a"></small></div><span>マップを見る ›</span></a>
  <a class="hall" href="shikahama-b.html"><div class="name">B館<small id="date-b"></small></div><span>マップを見る ›</span></a>
  <p class="note">機種をタップすると正式名が表示されます。<br>本マップは生成AIを活用して作成しています。実際の配置と異なる場合がありますので、店内表示をご確認ください。</p>
</main>
<script>
// 各館のマップに入っている日付（dateLabel）を読み取って、ボタンに表示する。
// 読み取れないときは何も表示しない（ボタンはそのまま使える）。
[['shikahama-a.html', 'date-a'], ['shikahama-b.html', 'date-b']].forEach(([file, id]) => {
  fetch(file, { cache: 'no-cache' })
    .then((r) => (r.ok ? r.text() : ''))
    .then((html) => {
      const m = html.match(/"dateLabel"\s*:\s*"([^"]*)"/);
      if (m) document.getElementById(id).textContent = m[1];
    })
    .catch(() => {});
});
</script>
</body>
</html>
