<style>
  :root { --brand:#23AC38; --dark:#16852A; --bg:#EEF6EF; --ink:#1A1A1A; --sel:#FFC400; }

  body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

  .search { width:100%; position:relative; }

  .search::before { content:""; position:absolute; left:12px; top:50%; width:13px; height:13px; margin-top:-8px; border:2.5px solid #888; border-radius:50%; }
  .search::after { content:""; position:absolute; left:24px; top:50%; width:7px; height:2.5px; margin-top:5px; background:#888; transform:rotate(45deg); }
  .results { position:absolute; left:0; right:0; top:calc(100% + 4px); background:#fff; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.2); max-height:45vh; overflow:auto; z-index:20; display:none; }
  .results button { display:block; width:100%; text-align:left; font:inherit; font-size:15px; font-weight:700; color:var(--ink); background:none; border:0; border-bottom:1px solid #eee; padding:10px 12px; }
  .results button small { display:block; font-size:12px; color:#666; font-weight:700; }
  .results .none { padding:10px 12px; font-size:14px; color:#666; }
  main { position:relative; flex:1; min-height:0; overflow:hidden; touch-action:none; cursor:grab; }
  main.drag { cursor:grabbing; }
  #map { width:100%; height:100%; display:block; user-select:none; -webkit-user-select:none; }
  #map text, #map image { pointer-events:none; }
  #map .seg { cursor:pointer; }
  #map .seg.hit { stroke:var(--sel); stroke-width:10; paint-order:stroke; }
  #map .seg.sel { stroke:#E60012; stroke-width:9; }
  #map .newitem { cursor:pointer; }
  .fit { position:absolute; right:12px; bottom:12px; font:inherit; font-size:14px; font-weight:900; color:#fff; background:var(--dark); border:0; border-radius:99px; padding:10px 16px; box-shadow:0 3px 10px rgba(0,0,0,.25); }
  .hint { position:absolute; left:12px; bottom:14px; font-size:12px; font-weight:700; color:#335; background:rgba(255,255,255,.9); padding:5px 10px; border-radius:99px; }
  footer.note { font-size:11px; font-weight:700; line-height:1.5; color:#444; background:#fff; padding:6px 12px calc(6px + env(safe-area-inset-bottom)); border-top:1px solid #ddd; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.22);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .2s ease; z-index:30; max-height:55vh; overflow:auto; }
  .sheet.open { transform:none; }
  .sheet .close { position:absolute; right:10px; top:8px; font:inherit; font-size:22px; line-height:1; border:0; background:none; color:#888; padding:6px; }
  .sheet h2 { margin:0 34px 6px 0; font-size:21px; font-weight:900; line-height:1.35; }
  .sheet .badge { display:inline-block; font-size:12px; font-weight:900; color:#0B3D1E; background:var(--sel); border-radius:99px; padding:2px 9px; margin-left:6px; vertical-align:3px; }
  .sheet dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:6px 0 0; font-size:15px; }
  .sheet dt { color:#666; font-weight:700; }
  .sheet dd { margin:0; font-weight:700; }

":"20円スロット","formal":["ウルトラミラクルジャグラー"]},{"id":"D2-A-2","abbr":"ファンキー","kind":"machine","count":4,"isNew":false,"rate":"20円スロット","formal":["ファンキージャグラー2"]},{"id":"D2-A-3","abbr":"ハッピー(緑)","kind":"machine","count":6,"isNew":false,"rate":"20円スロット","formal":["ハッピージャグラーVⅢ"]},{"id":"D2-B-0","abbr":"モンキー","kind":"machine","count":4,"isNew":false,"rate":"20円スロット","formal":["モンキーターン5"]},{"id":"D2-B-1","abbr":"【準備中】","kind":"preparing","count":0,"isNew":false,"rate":"20円スロット","formal":[]},{"id":"D2-B-2","abbr":"VVV2","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["革命機ヴァルヴレイヴ2"]},{"id":"D2-B-3","abbr":"頭文字","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["スマスロ頭文字"]},{"id":"D2-B-4","abbr":"北斗","kind":"machine","count":5,"isNew":false,"rate":"20円スロット","formal":["パチスロ北斗の拳"]},{"id":"W1-L-0","abbr":"彼女","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["レンタル彼女"]},{"id":"W1-L-1","abbr":"VVV2","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["革命機ヴァルヴレイヴ2"]},{"id":"W1-L-2","abbr":"ヤバチバ","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["ヤバチバ"]},{"id":"W1-L-3","abbr":"BIG","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["ビッグドリーム"]},{"id":"W1-L-4","abbr":"ルパン","kind":"machine","count":2,"isNew":false,"rate":"20円スロット","formal":["ルパン三世大航海者の秘宝"]},{"id":"W1-L-5","abbr":"麻雀","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["麻雀物語"]},{"id":"W1-L-6","abbr":"銭形5","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["銭形5"]},{"id":"W1-L-7","abbr":"銭形4","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["主役は銭形4"]},{"id":"W1-L-8","abbr":"ゴッドE","kind":"machine","count":3,"isNew":false,"rate":"20円スロット","formal":["パチスロゴッドイーターリザレクション"]},{"id":"W1-R-0","abbr":"鉄拳","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["パチスロ鉄拳6"]},{"id":"W1-R-1","abbr":"七つ","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["七つの魔剣が支配する"]},{"id":"W1-R-2","abbr":"ネオ","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["ネオプラネット"]},{"id":"W1-R-3","abbr":"桃鉄","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["桃太郎電鉄定番"]},{"id":"W1-R-4","abbr":"化物","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["スマスロ化物語"]},{"id":"W1-R-5","abbr":"忍魂","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["忍魂参 ~奥義皆伝ノ章~A3"]},{"id":"W1-R-6","abbr":"東リベ","kind":"machine","count":1,"isNew":false,"rate":"20円スロット","formal":["スマスロ東京リベンジャーズ"]},{"id":"W1-R-7","abbr":"北斗","kind":"machine","count":5,"isNew":false,"rate":"20円スロット","formal":["パチスロ北斗の拳"]}]};
(() => {
  const $ = (id) => document.getElementById(id);
  const svg = $('map'), stage = $('stage');
  $('store').textContent = DATA.store + ' フロアマップ';
  $('date').textContent = DATA.dateLabel;
  const segById = new Map(DATA.segments.map((s) => [s.id, s]));
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- 拡大・移動（viewBox を動かす） ----
  const full = svg.viewBox.baseVal; const F = { x: full.x, y: full.y, w: full.width, h: full.height };
  let vb = { ...F };
  const apply = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const scale = () => { const r = svg.getBoundingClientRect(); return Math.max(vb.w / r.width, vb.h / r.height); };
  const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(), s = scale(); return { x: vb.x + (cx - r.left - (r.width - vb.w / s) / 2) * s, y: vb.y + (cy - r.top - (r.height - vb.h / s) / 2) * s }; };
  const clamp = () => { vb.w = Math.min(Math.max(vb.w, F.w / 12), F.w); vb.h = vb.w * F.h / F.w;
    vb.x = Math.min(Math.max(vb.x, F.x - vb.w * 0.25), F.x + F.w - vb.w * 0.75); vb.y = Math.min(Math.max(vb.y, F.y - vb.h * 0.25), F.y + F.h - vb.h * 0.75); };
  const zoomAt = (cx, cy, k) => { const p = toSvg(cx, cy); const nw = Math.min(Math.max(vb.w / k, F.w / 12), F.w); const kk = vb.w / nw; vb.x = p.x - (p.x - vb.x) / kk; vb.y = p.y - (p.y - vb.y) / kk; vb.w = nw; vb.h = nw * F.h / F.w; clamp(); apply(); };
  let anim = null;
  const flyTo = (t) => { cancelAnimationFrame(anim); const s = { ...vb }, t0 = performance.now();
    const step = (now) => { const k = Math.min(1, (now - t0) / 280), e = 1 - Math.pow(1 - k, 3); for (const key of ['x', 'y', 'w', 'h']) vb[key] = s[key] + (t[key] - s[key]) * e; apply(); if (k < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step); };
  const focusBox = (b) => { const r = svg.getBoundingClientRect(); const aspect = r.width / r.height; let w = Math.max(b.width * 2.2, F.w / 5), h = w / aspect; if (h < b.height * 2.2) { h = b.height * 2.2; w = h * aspect; }
    w = Math.min(w, F.w); const t = { w, h: w * F.h / F.w, x: 0, y: 0 }; t.x = b.x + b.width / 2 - t.w / 2; t.y = b.y + b.height / 2 - t.h / 2; flyTo(t); };
  $('fit').onclick = () => flyTo({ ...F });

  const pts = new Map(); let gesture = null, lastTap = 0;
  stage.addEventListener('pointerdown', (e) => { if (e.target.closest('.fit,.hint')) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) gesture = { mode: 'pan', sx: e.clientX, sy: e.clientY, vb: { ...vb }, moved: 0, t: performance.now(), target: e.target };
    else if (pts.size === 2) { const [a, b] = [...pts.values()]; gesture = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), moved: 99 }; } });
  stage.addEventListener('pointermove', (e) => { if (!pts.has(e.pointerId) || !gesture) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (gesture.mode === 'pan' && pts.size === 1) { const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy; gesture.moved = Math.max(gesture.moved, Math.hypot(dx, dy));
      if (gesture.moved > 6) { stage.classList.add('drag'); const s = scale(); vb.x = gesture.vb.x - dx * s; vb.y = gesture.vb.y - dy * s; clamp(); apply(); } }
    else if (gesture.mode === 'pinch' && pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / gesture.d); gesture.d = d; } });
  const end = (e) => { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); stage.classList.remove('drag');
    if (gesture && gesture.mode === 'pan' && gesture.moved <= 6 && performance.now() - gesture.t < 500) {
      const now = performance.now();
      if (now - lastTap < 300) { zoomAt(e.clientX, e.clientY, 2); lastTap = 0; } else { lastTap = now; tap(gesture.target, e); }
    }
    if (pts.size === 0) gesture = null; else if (pts.size === 1) { const [p] = [...pts.values()]; gesture = { mode: 'pan', sx: p.x, sy: p.y, vb: { ...vb }, moved: 99 }; } };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });

  // ---- タップ → 詳細（正式名・略称・種別・台数） ----
  const clearMarks = () => svg.querySelectorAll('.seg.sel,.seg.hit').forEach((r) => r.classList.remove('sel', 'hit'));
  function tap(target, e) {
    let el = document.elementFromPoint(e.clientX, e.clientY) || target;
    const item = el.closest && el.closest('.newitem');
    if (item) { const s = segById.get(item.dataset.seg); if (s) select(s, true); return; }
    const r = el.closest && el.closest('.seg[data-seg]');
    if (r && segById.has(r.dataset.seg)) select(segById.get(r.dataset.seg), false); else closeSheet();
  }
  function select(s, move) {
    clearMarks(); const rect = svg.querySelector(`.seg[data-seg="${CSS.escape(s.id)}"]`); if (rect) { rect.classList.add('sel'); if (move) focusBox(rect.getBBox()); }
    $('hint').style.display = 'none';
    let html = '';
    if (s.kind === 'preparing') html = `<h2>${esc(s.abbr)}</h2><dl><dt>状態</dt><dd>準備中</dd></dl>`;
    else {
      const title = s.formal.length === 1 ? s.formal[0] : s.abbr;
      html = `<h2>${esc(title)}${s.isNew ? '<span class="badge">新台</span>' : ''}</h2><dl>` +
        (s.formal.length === 0 ? '<dt>正式名</dt><dd>未登録</dd>' : s.formal.length > 1 ? `<dt>正式名</dt><dd>${s.formal.map(esc).join('<br>')}</dd>` : '') +
        `<dt>略称</dt><dd>${esc(s.abbr)}</dd>` + (s.rate ? `<dt>種別</dt><dd>${esc(s.rate)}</dd>` : '') + `<dt>台数</dt><dd>${s.count}台</dd></dl>`;
    }
    $('detail').innerHTML = html; $('sheet').classList.add('open');
  }
  const closeSheet = () => { $('sheet').classList.remove('open'); clearMarks(); };
  $('close').onclick = closeSheet;

  // ---- 検索（全角/半角・ひらがな/カタカナ・大文字/小文字をそろえて部分一致） ----
  const norm = (s) => String(s || '').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/[\s・\-ー()（）【】]/g, '');
  const index = DATA.segments.filter((s) => s.kind !== 'preparing').map((s) => ({ s, key: norm(s.abbr + ' ' + s.formal.join(' ')) }));
  const box = $('results');
  $('q').addEventListener('input', () => {
    const q = norm($('q').value); clearMarks();
    if (!q) { box.style.display = 'none'; return; }
    const hits = index.filter((x) => x.key.includes(q));
    hits.forEach((x) => svg.querySelector(`.seg[data-seg="${CSS.escape(x.s.id)}"]`)?.classList.add('hit'));
    box.innerHTML = hits.length ? hits.slice(0, 50).map((x, i) => `<button type="button" data-i="${i}">${esc(x.s.formal[0] || x.s.abbr)}<small>略称：${esc(x.s.abbr)}　${x.s.count}台${x.s.isNew ? '　新台' : ''}</small></button>`).join('') : '<div class="none">見つかりませんでした</div>';
    box.style.display = 'block';
    box.querySelectorAll('button').forEach((b) => b.onclick = () => { box.style.display = 'none'; $('q').blur(); select(hits[+b.dataset.i].s, true); });
  });
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const b = box.querySelector('button'); if (b) b.click(); } });
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.search')) box.style.display = 'none'; });
})();
</script>
