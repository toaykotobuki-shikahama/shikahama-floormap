<style>
  :root { --brand:#E60012; --dark:#A8000D; --bg:#FDF0EE; --ink:#1A1A1A; --sel:#FFC400; }

  .search::before { content:""; position:absolute; left:12px; top:50%; width:13px; height:13px; margin-top:-8px; border:2.5px solid #888; border-radius:50%; }
  .search::after { content:""; position:absolute; left:24px; top:50%; width:7px; height:2.5px; margin-top:5px; background:#888; transform:rotate(45deg); }
  .results { position:absolute; left:0; right:0; top:calc(100% + 4px); background:#fff; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.2); max-height:45vh; overflow:auto; z-index:20; display:none; }
  .results button { display:block; width:100%; text-align:left; font:inherit; font-size:15px; font-weight:700; color:var(--ink); background:none; border:0; border-bottom:1px solid #eee; padding:10px 12px; }
  .results button small { display:block; font-size:12px; color:#666; font-weight:700; }
  .results .none { padding:10px 12px; font-size:14px; color:#666; }
  main { position:relative; flex:1; min-height:0; overflow:hidden; touch-action:none; cursor:grab; }

  #map { width:100%; height:100%; display:block; user-select:none; -webkit-user-select:none; }
  #map text, #map image { pointer-events:none; }

  #map .seg.sel { stroke:#E60012; stroke-width:9; }

  footer.note { font-size:11px; font-weight:700; line-height:1.5; color:#444; background:#fff; padding:6px 12px calc(6px + env(safe-area-inset-bottom)); border-top:1px solid #ddd; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.22);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .2s ease; z-index:30; max-height:55vh; overflow:auto; }
  .sheet.open { transform:none; }
  .sheet .close { position:absolute; right:10px; top:8px; font:inherit; font-size:22px; line-height:1; border:0; background:none; color:#888; padding:6px; }
  .sheet h2 { margin:0 34px 6px 0; font-size:21px; font-weight:900; line-height:1.35; }
  .sheet .badge { display:inline-block; font-size:12px; font-weight:900; color:#0B3D1E; background:var(--sel); border-radius:99px; padding:2px 9px; margin-left:6px; vertical-align:3px; }
  .sheet dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:6px 0 0; font-size:15px; }
  .sheet dt { color:#666; font-weight:700; }
  .sheet dd { margin:0; font-weight:700; }

      const title = s.formal.length === 1 ? s.formal[0] : s.abbr;
      html = `<h2>${esc(title)}${s.isNew ? '<span class="badge">新台</span>' : ''}</h2><dl>` +
        (s.formal.length === 0 ? '<dt>正式名</dt><dd>未登録</dd>' : s.formal.length > 1 ? `<dt>正式名</dt><dd>${s.formal.map(esc).join('<br>')}</dd>` : '') +
        `<dt>略称</dt><dd>${esc(s.abbr)}</dd>` + (s.rate ? `<dt>種別</dt><dd>${esc(s.rate)}</dd>` : '') + `<dt>台数</dt><dd>${s.count}台</dd></dl>`;
    }
    $('detail').innerHTML = html; $('sheet').classList.add('open');
  }
  const closeSheet = () => { $('sheet').classList.remove('open'); clearMarks(); };
  $('close').onclick = closeSheet;

  // ---- 検索（全角/半角・ひらがな/カタカナ・大文字/小文字をそろえて部分一致） ----
  const norm = (s) => String(s || '').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/[\s・\-ー()（）【】]/g, '');
  const index = DATA.segments.filter((s) => s.kind !== 'preparing').map((s) => ({ s, key: norm(s.abbr + ' ' + s.formal.join(' ')) }));
  const box = $('results');
  $('q').addEventListener('input', () => {
    const q = norm($('q').value); clearMarks();
    if (!q) { box.style.display = 'none'; return; }
    const hits = index.filter((x) => x.key.includes(q));
    hits.forEach((x) => svg.querySelector(`.seg[data-seg="${CSS.escape(x.s.id)}"]`)?.classList.add('hit'));
    box.innerHTML = hits.length ? hits.slice(0, 50).map((x, i) => `<button type="button" data-i="${i}">${esc(x.s.formal[0] || x.s.abbr)}<small>略称：${esc(x.s.abbr)}　${x.s.count}台${x.s.isNew ? '　新台' : ''}</small></button>`).join('') : '<div class="none">見つかりませんでした</div>';
    box.style.display = 'block';
    box.querySelectorAll('button').forEach((b) => b.onclick = () => { box.style.display = 'none'; $('q').blur(); select(hits[+b.dataset.i].s, true); });
  });
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const b = box.querySelector('button'); if (b) b.click(); } });
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.search')) box.style.display = 'none'; });
})();
</script>
</body>
</html>
